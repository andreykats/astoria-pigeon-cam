<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Astoria Pigeon Nest Cam</title>
  <meta name="description" content="A live look at a pigeon nest in a planter box outside a kitchen window in Astoria.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><circle cx='32' cy='32' r='30' fill='%23C1622D'/><circle cx='44' cy='26' r='9' fill='%23C1622D'/><circle cx='48' cy='23' r='1.6' fill='%23F8F1E4'/><path d='M53 26 L61 29 L53 32 Z' fill='%23EFB238'/><path d='M12 34 Q24 16 40 30 Q28 38 12 34 Z' fill='%237A8B5C'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Nunito+Sans:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <svg class="pigeon-mark" viewBox="0 0 100 100" aria-hidden="true">
        <ellipse cx="45" cy="60" rx="35" ry="28" fill="var(--color-accent)"/>
        <circle cx="72" cy="38" r="16" fill="var(--color-accent)"/>
        <circle cx="79" cy="33" r="2.5" fill="var(--color-bg)"/>
        <path d="M86 40 L98 44 L86 48 Z" fill="var(--color-egg)"/>
        <path d="M20 55 Q35 30 55 50 Q40 60 20 55 Z" fill="var(--color-sage)"/>
        <ellipse cx="30" cy="88" rx="4" ry="10" fill="var(--color-accent)" transform="rotate(10 30 88)"/>
        <ellipse cx="50" cy="90" rx="4" ry="10" fill="var(--color-accent)" transform="rotate(-6 50 90)"/>
      </svg>
      <div class="header-text">
        <h1>Astoria Pigeon Nest Cam</h1>
        <p class="tagline">Live from a planter box outside the kitchen window.</p>
      </div>
    </div>
  </header>

  <main>
    <section class="stream-section" aria-label="Live video and chat">
      <div class="stream-layout" data-state="loading">
        <div class="video-wrapper" id="video-wrapper">
          <div id="yt-player" class="yt-target"></div>
          <div class="state-overlay">
            <div class="status-loading">
              <div class="loading-egg" aria-hidden="true"></div>
              <p>Loading stream&hellip;</p>
            </div>
            <div class="status-offline">
              <svg class="pigeon-illustration pigeon-bob" viewBox="0 0 240 160" aria-hidden="true">
                <line x1="10" y1="140" x2="230" y2="140" stroke="var(--color-sage)" stroke-width="4" stroke-linecap="round"/>
                <path d="M140 140 Q150 118 175 118 Q200 118 210 140 Q175 150 140 140 Z" fill="none" stroke="var(--color-accent)" stroke-width="4" stroke-linecap="round"/>
                <path d="M148 132 Q175 122 202 132" fill="none" stroke="var(--color-accent)" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
                <ellipse cx="70" cy="105" rx="42" ry="34" fill="var(--color-accent)"/>
                <circle cx="105" cy="72" r="20" fill="var(--color-accent)"/>
                <circle cx="114" cy="66" r="3" fill="var(--color-bg)"/>
                <path d="M124 74 L140 79 L124 84 Z" fill="var(--color-egg)"/>
                <path d="M35 95 Q55 60 85 88 Q65 102 35 95 Z" fill="var(--color-sage)"/>
                <ellipse cx="55" cy="138" rx="5" ry="12" fill="var(--color-accent)" transform="rotate(8 55 138)"/>
                <ellipse cx="80" cy="140" rx="5" ry="12" fill="var(--color-accent)" transform="rotate(-6 80 140)"/>
              </svg>
              <p>Stream is offline &mdash; check back soon.</p>
            </div>
          </div>
        </div>
        <div class="chat-wrapper" id="chat-container" aria-label="Live chat">
          <div class="state-overlay">
            <div class="status-loading">
              <div class="loading-egg" aria-hidden="true"></div>
              <p>Loading chat&hellip;</p>
            </div>
            <div class="status-offline">
              <svg class="chat-icon" viewBox="0 0 80 80" aria-hidden="true">
                <path d="M14 16h52a6 6 0 0 1 6 6v28a6 6 0 0 1-6 6H34l-14 12V56h-6a6 6 0 0 1-6-6V22a6 6 0 0 1 6-6Z" fill="none" stroke="var(--color-accent)" stroke-width="4" stroke-linejoin="round"/>
                <circle cx="30" cy="36" r="3.5" fill="var(--color-accent)"/>
                <circle cx="44" cy="36" r="3.5" fill="var(--color-accent)"/>
                <circle cx="58" cy="36" r="3.5" fill="var(--color-accent)"/>
              </svg>
              <p>Chat unavailable &mdash; check back once the stream is live.</p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="timeline-section" aria-labelledby="timeline-heading">
      <h2 id="timeline-heading">Nest Timeline</h2>
      <div class="timeline-scroll">
        <ol class="timeline-list" id="timeline-list"></ol>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p>A little live window into a pigeon family&rsquo;s spring.</p>
  </footer>

  <script src="config.js"></script>
  <script src="timeline.js"></script>
  <script src="main.js"></script>
</body>
</html>
